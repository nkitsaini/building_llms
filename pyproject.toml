[project]
name = "building_llms"
version = "0.1.0"
requires-python = ">=3.14"
dependencies = [
	"makemore",
	"matplotlib>=3.11.0",
    "numpy>=2.4.6",
]

[dependency-groups]
dev = [
    "ipykernel>=7.3.0",
    "pytest>=9.1.0",
]

[tool.uv.sources]
makemore = { workspace = true }
torch = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu130" },
]
torchvision = [
  { index = "pytorch-cpu", extra = "cpu" },
  { index = "pytorch-cu130", extra = "cu130" },
]

[tool.uv.workspace]
members = ["*"]

[project.optional-dependencies]
cpu = [
  "torch>=2.12.0",
  "torchvision>=0.26.0",
]
cu130 = [
  "torch>=2.12.0",
  "torchvision>=0.26.0",
]

[tool.uv]
conflicts = [
  [
    { extra = "cpu" },
    { extra = "cu130" },
  ],
]


[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true
